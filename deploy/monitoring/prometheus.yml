global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: wirewall
    static_configs:
      - targets: ['127.0.0.1:9878']
        labels:
          project: wirewall
          environment: vds
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
