[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:9881/

[security]
admin_user = admin
admin_password = $__file{/etc/wirewall-monitoring/grafana-admin.secret}
secret_key = $__file{/etc/wirewall-monitoring/grafana-signing.secret}
cookie_samesite = strict
disable_gravatar = true
allow_embedding = false

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
